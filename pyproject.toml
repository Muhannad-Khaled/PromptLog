[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptlog"
version = "0.1.0"
description = "Git-like version control for AI prompts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ailigent", email = "you@example.com" }
]
keywords = ["llm", "prompts", "ai", "version-control", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
promptlog = "promptlog.cli:cli"

[project.urls]
Homepage = "https://github.com/yourusername/promptlog"
Repository = "https://github.com/yourusername/promptlog"
Issues = "https://github.com/yourusername/promptlog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlog"]